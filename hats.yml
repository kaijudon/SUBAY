# hats.yml — RENOVA vertical-slice pipeline (Planner → Builder → Reviewer)
event_loop:
  starting_event: "work.start"

hats:
  # ── 1. Planner: turn the issue card into an ordered plan ─────────────────────
  planner:
    name: "Planner"
    description: "Reads the slice issue card and writes an ordered TDD plan; no code."
    backend:
      command: claude
      args: ["--model", "claude-opus-4-8"]
    triggers: ["work.start"]
    publishes: ["plan.ready", "plan.blocked"]
    instructions: |
      You PLAN one RENOVA vertical slice. Do NOT write feature or test code.
      The slice's issue card path is in the slice prompt file (SliceNN_prompt.md)
      (e.g. prd/issues/01-export-de-id-chokepoint.md). Read it.

      First study the existing code so the plan fits reality:
        - renova/registry/models.py, validators.py, admin.py
        - renova/registry/management/commands/export_analysis_set.py
        - renova/registry/tests/  (the prior-art test patterns)

      Write a plan to docs/plans/Slice<NN>-plan.md (where <NN> is the two-digit
      slice number from the card path in the slice prompt file (SliceNN_prompt.md), e.g. Slice01-plan.md)
      containing:
        1. Every acceptance-criteria checkbox from the card, restated as a
           verifiable check.
        2. Ordered TDD steps: which test file each criterion gets, then the
           model / migration / admin / export change that satisfies it.
        3. The de-id leak-check assertion this slice must add
           (no calendar date / name / MRN in any export file).
        4. Dependencies: confirm blocker slices are already merged; note any
           model/FK this slice attaches to.

      If the card is unbuildable now (missing blocker slice, ambiguous spec),
      emit plan.blocked with a one-line reason. Otherwise emit plan.ready.

  # ── 2. Builder: execute the plan, test-first ────────────────────────────────
  builder:
    name: "Builder"
    description: "Implements the slice test-first by following the plan; runs pytest to green."
    backend:
      command: claude
      args: ["--model", "claude-sonnet-4-6"]
    triggers: ["plan.ready", "review.changes_requested"]
    publishes: ["build.done", "build.blocked"]
    instructions: |
      You implement the slice by following the plan in
      docs/plans/Slice<NN>-plan.md (<NN> = slice number from the card in
      the slice prompt file (SliceNN_prompt.md)). The issue card is in the slice prompt file (SliceNN_prompt.md). Read both.

      Repo conventions (study renova/registry/ before writing):
        - Validation lives ON THE MODELS (clean()/constraints), not the admin.
        - Subject IDs are STRINGS ([S|D]CMV[R|D][NN]); never coerce to int.
        - Dates exported only as integer day-offsets from kt_date (transplant=day 0).
        - django-simple-history on new outcome models; admin shows children as inlines.

      Work test-first (red → green):
        1. Write/extend tests under renova/registry/tests/ per the plan,
           including the de-id leak-check assertion.
        2. Run: .venv/bin/python -m pytest -q   — confirm new tests FAIL.
        3. Implement models, migrations, admin, extend export_analysis_set
           until tests pass.
        4. Run: .venv/bin/python manage.py makemigrations --check  (no missing)
           and .venv/bin/python -m pytest -q  — full suite GREEN.
        5. Run the backpressure collector — this produces the REAL evidence the
           build.done gate requires (do NOT hand-write or fabricate it):
             .venv/bin/python scripts/backpressure.py
           It runs tests/lint/typecheck/audit/coverage/complexity/duplication and
           exits 0 only when every check genuinely passes, printing one evidence
           line to stdout. If it exits non-zero, FIX the failing category (or emit
           build.blocked) — never massage the payload to get past the gate.

      When green, emit build.done with the collector's stdout line VERBATIM as the
      payload (e.g. "tests: pass, lint: pass, typecheck: pass, audit: pass,
      coverage: pass, complexity: <score>, duplication: pass, specs: pass"). If
      blocked for a reason you cannot resolve, STOP and emit build.blocked with a
      one-line reason.

  # ── 3. Reviewer: verify criteria + privacy gate ─────────────────────────────
  reviewer:
    name: "Reviewer"
    description: "Verifies acceptance criteria + de-id leak check; approves or requests changes."
    backend:
      command: claude
      args: ["--model", "claude-opus-4-8"]
    triggers: ["build.done"]
    publishes: ["review.approved", "review.changes_requested"]
    instructions: |
      Review the Builder's work against the issue card in the slice prompt file (SliceNN_prompt.md) and the plan
      in docs/plans/Slice<NN>-plan.md (<NN> = slice number from the slice prompt file (SliceNN_prompt.md)).
      Do NOT write feature code — verify only.

      Check every acceptance-criteria checkbox is actually met. Then:
        - Run .venv/bin/python -m pytest -q — must be fully green.
        - Independently re-run .venv/bin/python scripts/backpressure.py — it must
          exit 0 and its evidence line must match what the Builder put in
          build.done. Reject if the Builder's payload was hand-written or differs
          from the collector's real output.
        - Independently confirm the de-id leak-check: inspect the latest
          analysis_sets/<version>/ CSVs — reject if ANY calendar date, name,
          MRN, or address appears. Day-offset integers only. Confirm a seeded
          identifier makes the export REFUSE (non-zero exit, nothing written).
        - Confirm manifest.json carries per-file row counts, per-file SHA-256,
          and per-column type expectations.
        - Confirm validation sits on the models (shell/ingest path, not just
          admin); migrations complete.

      If all pass: emit review.approved and print LOOP_COMPLETE.
      If anything fails: emit review.changes_requested with a numbered list of
      exactly what to fix (re-triggers the Builder).
