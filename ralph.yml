cli:
  # Core config requires a STRING backend name here (the map form with
  # command/args is only valid per-hat in hats.yml). Model + headless flags are
  # set on each hat's backend in hats.yml.
  backend: claude
event_loop:
  prompt_file: Slice02_prompt.md
  completion_promise: LOOP_COMPLETE
  max_iterations: 100
RObot:
  enabled: true
  timeout_seconds: 120
