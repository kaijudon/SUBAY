# deploy/systemd/tmpfiles.d/subay.conf — Slice 15 §5/§7: recreate backup dirs on boot
# Install: sudo cp deploy/systemd/tmpfiles.d/subay.conf /etc/tmpfiles.d/subay.conf
#          sudo systemd-tmpfiles --create /etc/tmpfiles.d/subay.conf
#
# Why this exists: subay-backup.service and subay-history-export.service run under
# ProtectSystem=strict with ReadWritePaths=. systemd builds that sandbox BEFORE
# running the script, and every ReadWritePaths= dir must already exist — if one is
# missing the unit dies at status=226/NAMESPACE before ExecStart. A tmpfs clean or
# fresh boot can wipe these, so we recreate them here on every boot (RUNBOOK §9).
#
# Ownership mirrors the CHECKLIST setup steps: /var/lib/subay is root (the backup
# runs as root, writes last-backup.stamp there); the /var/backups/subay tree is
# subay-owned so the User=subay history-export can traverse and write into it.
d /var/lib/subay              0700 root  root  -
d /var/backups/subay          0700 subay subay -
d /var/backups/subay/history  0700 subay subay -
