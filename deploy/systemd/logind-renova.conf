# deploy/systemd/logind-renova.conf — Slice 15 §4: laptop must not sleep
# Install as /etc/systemd/logind.conf.d/renova.conf, then: sudo systemctl restart systemd-logind
#
# This box is a SERVER that happens to be a laptop. If it suspends when the lid
# closes, nightly backups and the healthcheck stop and Postgres may be paused
# mid-write. Keep it running with the lid shut.
#
# SECURITY COUNTERPART (RUNBOOK §4/§8): because it never sleeps on lid-close, when
# you leave it unattended you must power it fully OFF (not suspend) and lock it
# away — suspend keeps the LUKS key in RAM, so a suspended laptop is NOT protected.

[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
