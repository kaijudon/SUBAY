# deploy/firewall/sshd-hardening.conf — Slice 15 §2: key-only SSH drop-in
# Install as /etc/ssh/sshd_config.d/10-renova.conf, then: sudo sshd -t && sudo systemctl restart ssh
#
# WARNING: put your public key in ~/.ssh/authorized_keys and test a NEW session
# BEFORE closing your current one, or you can lock yourself out of a remote box.
# (On a box you sit at physically, a lockout just means logging in at the console.)

# No passwords over SSH — keys only. Defeats brute-force against 22 entirely.
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes

# root can never log in over SSH; administer via a normal user + sudo.
PermitRootLogin no

# Fail fast, don't linger — smaller window for abuse.
MaxAuthTries 3
LoginGraceTime 20
PermitEmptyPasswords no

# Only the operator account may SSH in. EDIT to your username (or a group).
AllowUsers kaijudon
