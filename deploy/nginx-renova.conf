# RENOVA — localhost-only HTTPS reverse proxy to the gunicorn Unix socket.
# The app listens on no public interface: nginx binds 127.0.0.1 only.
upstream renova_app {
    server unix:/run/renova/gunicorn.sock;
}

server {
    listen 127.0.0.1:443 ssl;
    server_name localhost;

    ssl_certificate     /etc/renova/tls/renova.crt;   # locally-trusted cert
    ssl_certificate_key /etc/renova/tls/renova.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/renova.access.log;
    error_log  /var/log/nginx/renova.error.log;

    client_max_body_size 25m;   # headroom for .ab1 / report uploads in later slices

    location /static/ {
        alias /opt/renova/staticfiles/;
    }

    location / {
        proxy_pass         http://renova_app;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Real-IP         $remote_addr;
    }
}
