# SUBAY — SSH hardening drop-in (Slice 15, AC2).
# Install at /etc/ssh/sshd_config.d/10-subay.conf, then: sudo sshd -t && sudo systemctl reload ssh
#
# WHY: the box sits on the hospital LAN. SSH is the one remote door; make it key-only,
# rootless, and LAN-bound. Passwords are brute-forceable; keys are not.

# Key-only: no passwords, no keyboard-interactive, no challenge-response.
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes

# No direct root login — admins log in as themselves, then sudo (audit trail).
PermitRootLogin no

# Bind to the LAN interface only (replace with the box's real LAN IP). Never 0.0.0.0
# on a public interface. UFW (below) is the belt to this suspenders.
# ListenAddress 192.0.2.10

# Tighten the session.
MaxAuthTries 3
LoginGraceTime 20
X11Forwarding no
AllowAgentForwarding no
PermitEmptyPasswords no

# Restrict who may SSH at all (the admin account(s), not the subay service user).
# AllowUsers admin
